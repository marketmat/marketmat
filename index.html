<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Mat</title>
<style>
:root{--green:#0b3d24;--mat:#197443;--gold:#d4af37;--ink:#06110b;--panel:#0b1911;--line:#294936;--white:#f4f4f0;--bull:#5cff88;--bear:#ff6565;--yellow:#ffd83d;--vwap:#54b9ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 35%,#123b25 0,#06110b 55%,#030806 100%);color:var(--white);font-family:Inter,Arial,sans-serif}.app{min-height:100vh;padding:18px;max-width:1500px;margin:auto}
header{display:flex;align-items:center;gap:18px;margin-bottom:16px}h1{margin:0;font-size:30px;letter-spacing:3px}.asset{background:#0d2116;color:white;border:1px solid var(--gold);border-radius:8px;padding:11px 38px 11px 13px;font-size:15px}.live{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:#a8c9b1}.dot{width:9px;height:9px;border-radius:50%;background:var(--bull);box-shadow:0 0 10px var(--bull)}
.layout{display:grid;grid-template-columns:92px minmax(500px,1fr) 320px;gap:18px;align-items:start}.timeframes{display:flex;flex-direction:column;gap:7px}.timeframes button{background:#0c2115;color:#c8d8cd;border:1px solid #31543e;border-radius:7px;padding:11px 5px;font-weight:700;cursor:pointer}.timeframes button.active{background:var(--gold);color:#06110b;border-color:#ffe58a;box-shadow:0 0 14px #d4af3740}
.mat-wrap{display:flex;justify-content:center}.mat{width:min(72vw,790px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 45%,#21824b 0,#176b3e 60%,#115b35 100%);border:18px solid var(--gold);box-shadow:0 18px 50px #000,0 0 0 3px #8e7220 inset;position:relative;overflow:hidden}.mat:before{content:"";position:absolute;inset:12%;border:1px solid #ffffff18;border-radius:50%;pointer-events:none}.center{position:absolute;width:86px;height:86px;border:4px solid var(--gold);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none}.center:after{content:"";position:absolute;inset:16px;border:1px solid #ffffff35;border-radius:50%}canvas{position:absolute;inset:42px;width:calc(100% - 84px);height:calc(100% - 84px)}

.right{min-width:0}.scoreboard{background:#0b0b0b;border:3px solid var(--gold);border-radius:8px;padding:13px;box-shadow:0 8px 24px #000;position:relative}.score-title{font-size:11px;letter-spacing:2px;color:var(--gold);text-align:center}.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.team{text-align:center;background:#151515;padding:7px;border:1px solid #303030}.team:first-child{border-bottom:3px solid var(--bull)}.team:last-child{border-bottom:3px solid var(--bear)}.team-name{font-size:12px;letter-spacing:1px}.score{font:800 46px/1 monospace;margin-top:5px}.bull{color:var(--bull)}.bear{color:var(--bear)}.clock{margin:10px auto 0;width:max-content;background:#050505;border:1px solid #444;padding:5px 12px;font:700 23px/1 monospace;letter-spacing:2px}.period{font-size:10px;color:#aaa;text-align:center;margin-top:4px}
.status{margin-top:12px;text-align:center;padding:11px;border-radius:6px;font-weight:800;font-size:13px;letter-spacing:.6px}.confirmed{background:#123b23;border:1px solid var(--bull);color:#8dffa9}.developing{background:#3a2d0b;border:1px solid var(--gold);color:#ffe58a}.short{background:#42151a;border:1px solid var(--bear);color:#ff9b9b}
.bias{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.bias div{background:#0c1a11;border:1px solid var(--line);padding:8px 4px;text-align:center;border-radius:5px;font-size:10px}.bias strong{display:block;font-size:11px;margin-top:3px}
.why{margin-top:12px;background:#0b1911;border:1px solid var(--line);border-radius:8px;padding:13px}.why h2{margin:0 0 8px;font-size:15px}.factor{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #1c3325;font-size:12px}.factor:last-child{border-bottom:0}.good{color:var(--bull)}.bad{color:var(--bear)}.neutral{color:#c9c9c9}.missing{margin-top:10px;font-size:11px;color:#ffe58a}.alert{margin-top:12px;width:100%;background:#10251a;color:#fff;border:1px solid var(--gold);border-radius:6px;padding:11px;cursor:pointer;font-weight:700}.alert.on{background:#154e2b;border-color:var(--bull);color:#a4ffb8}
.legend{display:flex;gap:14px;justify-content:center;margin-top:8px;font-size:10px;color:#cbd7cf}.legend span{display:flex;align-items:center;gap:5px}.swatch{width:16px;height:3px;display:inline-block}
.footer{margin-top:12px;text-align:center;color:#6f8977;font-size:10px}
@media(max-width:1050px){.layout{grid-template-columns:78px 1fr}.right{grid-column:1/-1}.mat{width:min(84vw,700px)}}
@media(max-width:650px){.app{padding:10px}.layout{grid-template-columns:62px 1fr;gap:10px}header{gap:9px}h1{font-size:22px}.live{display:none}.mat{width:calc(100vw - 82px);border-width:10px}.mat canvas{inset:25px;width:calc(100% - 50px);height:calc(100% - 50px)}.right{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app">
<header><h1>MARKET MAT</h1><select id="asset" class="asset"><option>BTC/USD</option><option>ETH/USD</option><option>SOL/USD</option><option>HYPE/USD</option><option>NASDAQ</option></select><div class="live"><span class="dot"></span>PROTOTYPE DATA</div></header>
<div class="layout">
<div class="timeframes" id="timeframes"></div>
<div>
<div class="mat-wrap"><div class="mat"><canvas id="chart"></canvas><div class="center"></div></div></div>
<div class="legend"><span><i class="swatch" style="background:var(--yellow)"></i>200 EMA</span><span><i class="swatch" style="background:white"></i>21 MA</span><span><i class="swatch" style="background:var(--vwap)"></i>VWAP</span></div>
</div>
<div class="right">
<div class="scoreboard"><div class="score-title">MARKET MAT • SCORE CLOCK</div><div class="scores"><div class="team"><div class="team-name">HOME • BULLS</div><div id="bullScore" class="score bull">50</div></div><div class="team"><div class="team-name">VISITOR • BEARS</div><div id="bearScore" class="score bear">50</div></div></div><div id="clock" class="clock">15:00</div><div id="period" class="period">15 MINUTE</div><div id="status" class="status developing">SCALP DEVELOPING</div></div>
<div class="bias" id="bias"></div>
<div class="why"><h2>WHY THIS SCORE</h2><div id="factors"></div><div id="missing" class="missing"></div></div>
<button id="alertBtn" class="alert">🔔 ENABLE SCALP ALERT</button>
</div>
</div>
<div class="footer">Market Mat prototype • scores are analytical signals, not guarantees</div>
</div>
<script>
const TF=[['1M',1],['5M',5],['15M',15],['1H',60],['4H',240],['1D',1440],['1W',10080],['1MO',43200]];
const weights={weekly:25,daily:25,h4:25,ma:10,vwap:5,stoch:3,div:4,volume:3};
let selected='15M',asset='BTC/USD',alertOn=false;
const $=id=>document.getElementById(id);
TF.forEach(([name])=>{const b=document.createElement('button');b.textContent=name;b.dataset.tf=name;b.onclick=()=>{selected=name;render()};$('timeframes').appendChild(b)});
$('asset').onchange=e=>{asset=e.target.value;render()};
$('alertBtn').onclick=()=>{alertOn=!alertOn;$('alertBtn').classList.toggle('on',alertOn);$('alertBtn').textContent=alertOn?'🔔 SCALP ALERT ENABLED':'🔔 ENABLE SCALP ALERT'};
function seed(){let s=0;for(const c of asset)s=(s*31+c.charCodeAt(0))%100000;s+=TF.find(x=>x[0]===selected)[1]*17;return s}
function rand(i){const x=Math.sin(seed()*0.001+i*12.9898)*43758.5453;return x-Math.floor(x)}
function analysis(){
 const t=TF.find(x=>x[0]===selected)[1], s=seed();
 const bullish=((s%100)/100)>.34;
 const weekly=((s%17)>5)?1:-1,daily=((s%13)>4)?1:-1,h4=((s%11)>3)?1:-1;
 const above200=bullish, touch21=(s%5)!==0, aboveVWAP=bullish, stoch=((s%7)!==0), div=((s%9)<4), volume=((s%6)!==0);
 let bull=0; bull+=weekly>0?25:0; bull+=daily>0?25:0; bull+=h4>0?25:0; bull+=(above200&&touch21)?10:0; bull+=aboveVWAP?5:0; bull+=stoch?3:0; bull+=div?4:0; bull+=volume?3:0;
 let bear=100-bull;
 // Keep opposite score complementary, but require higher-timeframe direction to dominate scalp confirmation.
 const longConfirmed=weekly>0&&daily>0&&h4>0&&above200&&touch21&&stoch&&aboveVWAP;
 const shortConfirmed=weekly<0&&daily<0&&h4<0&&!above200&&touch21&&!stoch&&!aboveVWAP;
 return {t,weekly,daily,h4,above200,touch21,aboveVWAP,stoch,div,volume,bull,bear,longConfirmed,shortConfirmed};
}
function render(){
 const a=analysis();document.querySelectorAll('.timeframes button').forEach(b=>b.classList.toggle('active',b.dataset.tf===selected));
 $('bullScore').textContent=a.bull;$('bearScore').textContent=a.bear;$('period').textContent=selected+' • '+asset;
 $('status').className='status '+(a.longConfirmed?'confirmed':a.shortConfirmed?'short':'developing');
 $('status').textContent=a.longConfirmed?'CONFIRMED SCALP LONG':a.shortConfirmed?'CONFIRMED SCALP SHORT':'SCALP DEVELOPING';
 $('clock').textContent=countdown(a.t);
 $('bias').innerHTML=[['WEEKLY',a.weekly],['DAILY',a.daily],['4H',a.h4]].map(x=>'<div>'+x[0]+'<strong class="'+(x[1]>0?'good':'bad')+'">'+(x[1]>0?'BULLISH':'BEARISH')+'</strong></div>').join('');
 const rows=[['Weekly Bias',a.weekly>0,'+25','-25'],['Daily Bias',a.daily>0,'+25','-25'],['4H Bias',a.h4>0,'+25','-25'],['21 MA / 200 EMA',a.above200&&a.touch21,'+10','0'],['VWAP',a.aboveVWAP,'+5','0'],['Stoch RSI',a.stoch,'+3','0'],['RSI Divergence',a.div,'+4','0'],['Volume',a.volume,'+3','0']];
 $('factors').innerHTML=rows.map(r=>'<div class="factor"><span>'+r[0]+'</span><span class="'+(r[1]?'good':'bad')+'">'+(r[1]?'✓ '+r[2]:'✕ '+r[3])+'</span></div>').join('');
 const missing=[];if(a.weekly<0||a.daily<0||a.h4<0)missing.push('higher-timeframe bullish alignment');if(!a.above200)missing.push('price above 200 EMA');if(!a.touch21)missing.push('21 MA retest');if(!a.aboveVWAP)missing.push('price above VWAP');if(!a.stoch)missing.push('Stoch RSI confirmation');
 $('missing').textContent=missing.length?'Missing for long: '+missing.join(' • '):'All required long conditions confirmed.';
 draw(a);
}
function countdown(minutes){const now=Date.now(),ms=minutes*60000,remain=ms-(now%ms);const sec=Math.floor(remain/1000);return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function draw(a){
 const c=$('chart'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
 const n=48,pad=8,step=(w-pad*2)/n;let prices=[],p=50;for(let i=0;i<n;i++){p+=(rand(i)-.48)*7;prices.push(p)}const min=Math.min(...prices)-8,max=Math.max(...prices)+8,sy=v=>h-pad-(v-min)/(max-min)*(h-pad*2);
 x.globalAlpha=.18;x.strokeStyle='#fff';x.lineWidth=1;for(let i=1;i<5;i++){let yy=h*i/5;x.beginPath();x.moveTo(0,yy);x.lineTo(w,yy);x.stroke()}x.globalAlpha=1;
 for(let i=0;i<n;i++){let o=prices[i]-(rand(i+2)-.5)*4,cl=prices[i],hi=Math.max(o,cl)+rand(i+3)*3,lo=Math.min(o,cl)-rand(i+4)*3,xx=pad+i*step; x.strokeStyle='#d7e4da';x.beginPath();x.moveTo(xx+step/2,sy(hi));x.lineTo(xx+step/2,sy(lo));x.stroke();x.fillStyle=cl>=o?'#73e39a':'#ff7474';x.fillRect(xx+step*.18,sy(Math.max(o,cl)),Math.max(2,step*.62),Math.max(2,Math.abs(sy(o)-sy(cl))))}
 line(x,prices.map((v,i)=>v+5+Math.sin(i/4)*2),sy,'#ffd83d',2);line(x,prices.map((v,i)=>v+1.3+Math.sin(i/3)*1.2),sy,'#fff',2);line(x,prices.map((v,i)=>v-2),sy,'#54b9ff',1.5,true);
}
function line(x,arr,sy,color,width,dash=false){x.strokeStyle=color;x.lineWidth=width;x.setLineDash(dash?[5,4]:[]);x.beginPath();arr.forEach((v,i)=>{const xx=8+i*((x.canvas.clientWidth-16)/arr.length),yy=sy(v);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();x.setLineDash([])}
render();setInterval(()=>{$('clock').textContent=countdown(TF.find(x=>x[0]===selected)[1])},1000);
</script>
</body>
</html>
